# MenSharp compiler messages — English.
#
# One entry per diagnostic. `{name}` is filled in by the compiler; `{{` is
# a literal brace. A key missing here is shown as the key itself, so keep
# this file complete; the other languages fall back to it.

[ui]
list_separator = ", "
error_heading = "Error"
hint_heading = "Hint"
error_count = "{count} error(s)"
errors_not_emitting = "{count} error(s); not emitting Udon assembly"
programs_failed = "{count} program(s) failed"

